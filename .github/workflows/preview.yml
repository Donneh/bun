name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

defaults:
  run:
    shell: bash

env:
  PR: ${{ github.event.pull_request.number }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  MARKER: "<!-- riftkeeper-preview -->"
  WORKER_NAME: riftkeeper-web
  WRANGLER_VERSION: 4.154.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Build the page against the production API, with the preview bar
        env:
          NUXT_PUBLIC_PREVIEW_HREF: ${{ github.event.pull_request.html_url }}
        run: |
          NUXT_PUBLIC_PREVIEW_LABEL="Pull request #$PR at ${HEAD_SHA:0:7}" bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: apps/web/.output/public/
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    outputs:
      url: ${{ steps.upload.outputs.url }}
      deployment_url: ${{ steps.upload.outputs.deployment_url }}
    steps:
      - name: Check that previews are set up
        id: setup
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=No preview::The preview environment has no CLOUDFLARE_API_TOKEN secret or no CLOUDFLARE_ACCOUNT_ID variable, so this pull request gets no preview. See 'Previews' in infrastructure/README.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.setup.outputs.ready == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install wrangler ${{ env.WRANGLER_VERSION }} from npm
        if: ${{ steps.setup.outputs.ready == 'true' }}
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund "wrangler@$WRANGLER_VERSION"
      - if: ${{ steps.setup.outputs.ready == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: ${{ runner.temp }}/site/public
      - name: Write the wrangler configuration of an assets-only preview
        if: ${{ steps.setup.outputs.ready == 'true' }}
        run: |
          jq -n --arg name "$WORKER_NAME" '{
            name: $name,
            compatibility_date: "2026-10-23",
            assets: { directory: "./public", not_found_handling: "single-page-application" },
            previews: {}
          }' > "$RUNNER_TEMP/site/wrangler.json"
      - name: Upload the preview ${{ env.PREVIEW_NAME }}
        id: upload
        if: ${{ steps.setup.outputs.ready == 'true' }}
        working-directory: ${{ runner.temp }}/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" preview --config wrangler.json --name "$PREVIEW_NAME" --tag "${HEAD_SHA:0:7}"
          url=$(jq -r 'select(.type == "preview") | .preview_urls[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error title=No preview URL::Cloudflare returned no preview URL. Preview URLs on workers.dev must be on for riftkeeper-web (subdomain.previews_enabled in infrastructure/main.tf)."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$(jq -r 'select(.type == "preview") | .deployment_urls[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")" >> "$GITHUB_OUTPUT"

  verify:
    needs: upload
    if: ${{ needs.upload.outputs.url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      URL: ${{ needs.upload.outputs.url }}
      SCREENSHOTS: ${{ github.workspace }}/apps/web/test-results/preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx playwright install --with-deps chromium
      - name: Check the preview in a browser
        run: node verify-live/cli.ts "$URL" --out "$SCREENSHOTS"
      - name: Check that the preview is not indexed
        if: ${{ !cancelled() }}
        run: |
          curl --fail --silent --show-error --head "$URL/" | grep -i '^x-robots-tag: .*noindex'
      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-screenshots
          path: ${{ env.SCREENSHOTS }}
          if-no-files-found: ignore
          retention-days: 30

  comment:
    needs: [upload, verify]
    if: ${{ !cancelled() && needs.upload.outputs.url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      URL: ${{ needs.upload.outputs.url }}
      DEPLOYMENT_URL: ${{ needs.upload.outputs.deployment_url }}
      CHECKS: ${{ needs.verify.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Write the preview comment
        run: |
          {
            echo "$MARKER"
            echo "## Preview"
            echo
            echo "**[$URL]($URL)** serves this pull request at ${HEAD_SHA:0:7}, built against the production API. The link stays the same on every push, and the preview is deleted when the pull request closes."
            echo
            if [ "$CHECKS" = "success" ]; then
              echo "The browser checks passed on desktop and phone, in light and dark: [screenshots]($RUN_URL)."
            else
              echo "**The browser checks of ${HEAD_SHA:0:7} ended with \`$CHECKS\`**, see [the run]($RUN_URL)."
            fi
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo
              echo "This commit only: $DEPLOYMENT_URL"
            fi
            echo
            echo "The page shows a Preview bar and is not indexed. A preview is neither a Worker version nor a deployment, so production is unchanged."
          } > "$RUNNER_TEMP/preview-comment.md"
      - name: Post or update the preview comment
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($ENV.MARKER))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/preview-comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/preview-comment.md" > /dev/null
          fi

  cleanup:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    environment: preview
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check that previews are set up
        id: setup
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.setup.outputs.ready == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install wrangler ${{ env.WRANGLER_VERSION }} from npm
        if: ${{ steps.setup.outputs.ready == 'true' }}
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund "wrangler@$WRANGLER_VERSION"
      - name: Delete the preview ${{ env.PREVIEW_NAME }}
        if: ${{ steps.setup.outputs.ready == 'true' }}
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" preview delete --worker-name "$WORKER_NAME" --name "$PREVIEW_NAME" --skip-confirmation 2> "$RUNNER_TEMP/delete.log"; then
            cat "$RUNNER_TEMP/delete.log"
            grep -qi 'not found\|10025' "$RUNNER_TEMP/delete.log" || exit 1
          fi
      - name: Mark the preview comment as deleted
        if: ${{ steps.setup.outputs.ready == 'true' }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($ENV.MARKER))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            printf '%s\n## Preview\n\nThe preview was deleted when the pull request closed.\n' "$MARKER" > "$RUNNER_TEMP/preview-comment.md"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/preview-comment.md" > /dev/null
          fi
