name: Delete pull request screenshots

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  delete:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SCREENSHOTS_REF: refs/screenshots/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete ${{ env.SCREENSHOTS_REF }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/${SCREENSHOTS_REF#refs/}" \
            --jq '.[] | select(.ref == $ENV.SCREENSHOTS_REF) | .ref' > "$RUNNER_TEMP/existing-ref.txt"
          if [ -s "$RUNNER_TEMP/existing-ref.txt" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/${SCREENSHOTS_REF}"
          else
            echo "::notice::$SCREENSHOTS_REF does not exist"
          fi
