name: Monitor production

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run the black-box suite against production
        run: bun run test:api
        env:
          BASE_URL: https://api.riftkeeper.app

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run the website smoke test against production
        run: bun run test:production
        working-directory: apps/web
        env:
          BASE_URL: https://riftkeeper.app
          WWW_URL: https://www.riftkeeper.app
      - name: Upload smoke test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: monitor-web-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
