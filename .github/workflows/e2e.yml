name: E2E

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    outputs:
      screenshots: ${{ steps.screenshots.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Find the screenshots for the pull request
        id: screenshots
        if: ${{ !cancelled() }}
        run: |
          if [ -f test-results/verify-live/reports.json ]; then
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the screenshots for the pull request
        if: ${{ !cancelled() && steps.screenshots.outputs.saved == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            apps/web/test-results/verify-live/*.jpg
            apps/web/test-results/verify-live/reports.json
          if-no-files-found: error
          retention-days: 1
      - run: bun run test:dev
      - name: Upload videos and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-and-screenshots
          path: apps/web/test-results/
          if-no-files-found: error
          retention-days: 30

  screenshots:
    needs: web
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SCREENSHOTS_REF: refs/screenshots/pr-${{ github.event.pull_request.number }}
      MARKER: "<!-- riftkeeper-screenshots -->"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SAVED: ${{ needs.web.outputs.screenshots == 'true' }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check that this run tested the head of the pull request
        id: head
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The pull request moved on to $current, so this run leaves the comment to the newer run"
          fi
      - if: ${{ steps.head.outputs.current == 'true' && env.SAVED == 'true' }}
        uses: actions/checkout@v4
      - if: ${{ steps.head.outputs.current == 'true' && env.SAVED == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: ${{ steps.head.outputs.current == 'true' && env.SAVED == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Push the screenshots to ${{ env.SCREENSHOTS_REF }}
        id: push
        if: ${{ steps.head.outputs.current == 'true' && env.SAVED == 'true' }}
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/screenshots-index"
          parent=()
          if git fetch --no-tags --depth=1 origin "$SCREENSHOTS_REF"; then
            git read-tree FETCH_HEAD
            parent=(-p FETCH_HEAD)
          else
            git read-tree --empty
          fi
          for file in "$RUNNER_TEMP"/screenshots/*.jpg; do
            git update-index --add --cacheinfo "100644,$(git hash-object -w "$file"),$HEAD_SHA/$(basename "$file")"
          done
          commit=$(git commit-tree "$(git write-tree)" "${parent[@]}" -m "Screenshots of $HEAD_SHA for #$PR")
          git push origin "$commit:$SCREENSHOTS_REF"
          echo "images=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$commit/$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Write the screenshot comment
        if: ${{ steps.head.outputs.current == 'true' && env.SAVED == 'true' }}
        env:
          IMAGES: ${{ steps.push.outputs.images }}
        run: |
          {
            echo "$MARKER"
            bun apps/web/verify-live/pull-request-comment-cli.ts \
              --reports "$RUNNER_TEMP/screenshots/reports.json" --images "$IMAGES" --commit "$HEAD_SHA" --run "$RUN_URL"
          } > "$RUNNER_TEMP/screenshot-comment.md"
      - name: Write that this commit has no screenshots
        if: ${{ steps.head.outputs.current == 'true' && env.SAVED != 'true' }}
        run: |
          {
            echo "$MARKER"
            echo "## Screenshots"
            echo
            echo "No screenshots of ${HEAD_SHA:0:7}: the [E2E run]($RUN_URL) failed before \`verify:live\` saved them."
          } > "$RUNNER_TEMP/screenshot-comment.md"
      - name: Post or update the screenshot comment
        if: ${{ steps.head.outputs.current == 'true' }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($ENV.MARKER))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/screenshot-comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/screenshot-comment.md" > /dev/null
          fi
