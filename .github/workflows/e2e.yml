name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.body && github.run_id || 'latest' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MARKER: "<!-- riftkeeper-screenshots -->"
  IMAGES_PLACEHOLDER: https://raw.githubusercontent.com/${{ github.repository }}/0000000000000000000000000000000000000000
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  web:
    if: ${{ github.event.action != 'edited' || github.event.changes.body }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    outputs:
      changed: ${{ steps.changes.outputs.web }}
      screenshots: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether the pull request changes the web page
        id: changes
        working-directory: .
        run: |
          git diff --name-only HEAD^1 HEAD -- apps/web packages/ui packages/cards packages/search bun.lock .github/workflows/e2e.yml > "$RUNNER_TEMP/web-changes.txt"
          if [ -s "$RUNNER_TEMP/web-changes.txt" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
      - run: bun run test:dev
      - name: Write the screenshot comment
        id: comment
        if: ${{ !cancelled() && steps.changes.outputs.web == 'true' }}
        continue-on-error: true
        env:
          E2E_RESULT: ${{ job.status }}
        run: |
          if [ -f test-results/verify-live/reports.json ]; then
            mkdir -p test-results/pull-request-screenshots
            {
              echo "$MARKER"
              bun verify-live/pull-request-comment-cli.ts --reports test-results/verify-live/reports.json \
                --requested test-results/verify-live/requested-paths.json --image-list "$RUNNER_TEMP/shown-images.txt" \
                --images "$IMAGES_PLACEHOLDER" --commit "$HEAD_SHA" --run "$RUN_URL" --e2e "$E2E_RESULT"
            } > test-results/pull-request-screenshots/pull-request-comment.md
            while read -r image; do
              cp "test-results/verify-live/$image" test-results/pull-request-screenshots/
            done < "$RUNNER_TEMP/shown-images.txt"
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the screenshots for the pull request
        id: upload
        if: ${{ !cancelled() && steps.comment.outputs.saved == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/test-results/pull-request-screenshots/
          if-no-files-found: error
          retention-days: 1
      - name: Upload videos and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-and-screenshots
          path: apps/web/test-results/
          if-no-files-found: error
          retention-days: 30

  screenshots:
    needs: web
    if: ${{ !cancelled() && needs.web.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR: ${{ github.event.pull_request.number }}
      SCREENSHOTS_REF: refs/screenshots/pr-${{ github.event.pull_request.number }}
      SAVED: ${{ needs.web.outputs.screenshots == 'true' }}
      WEB_RESULT: ${{ needs.web.result }}
    steps:
      - name: Check that this run tested the head of the pull request
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The pull request moved on to $current, so this run leaves the comment to the newer run"
          fi
      - if: ${{ steps.head.outputs.current == 'true' && env.SAVED == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Replace ${{ env.SCREENSHOTS_REF }} with a commit of only these screenshots
        id: push
        if: ${{ steps.head.outputs.current == 'true' && env.SAVED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in "$RUNNER_TEMP"/screenshots/*.jpg; do
            base64 -w0 "$file" > "$RUNNER_TEMP/blob.b64"
            jq -n --rawfile content "$RUNNER_TEMP/blob.b64" '{content: $content, encoding: "base64"}' > "$RUNNER_TEMP/blob.json"
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
            jq -n --arg path "$(basename "$file")" --arg sha "$sha" '{path: $path, mode: "100644", type: "blob", sha: $sha}' >> "$RUNNER_TEMP/tree-entries.json"
          done
          jq -s '{tree: .}' "$RUNNER_TEMP/tree-entries.json" > "$RUNNER_TEMP/tree.json"
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree.json" --jq .sha)
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" -f "tree=$tree" -f "message=Screenshots of $HEAD_SHA for #$PR" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/${SCREENSHOTS_REF#refs/}" \
            --jq '.[] | select(.ref == $ENV.SCREENSHOTS_REF) | .ref' > "$RUNNER_TEMP/existing-ref.txt"
          if [ -s "$RUNNER_TEMP/existing-ref.txt" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/${SCREENSHOTS_REF}" -f "sha=$commit" -F force=true > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=$SCREENSHOTS_REF" -f "sha=$commit" > /dev/null
          fi
          echo "images=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$commit" >> "$GITHUB_OUTPUT"
      - name: Point the screenshot comment at the pushed images
        if: ${{ steps.head.outputs.current == 'true' && env.SAVED == 'true' }}
        env:
          IMAGES: ${{ steps.push.outputs.images }}
        run: sed "s|$IMAGES_PLACEHOLDER|$IMAGES|g" "$RUNNER_TEMP/screenshots/pull-request-comment.md" > "$RUNNER_TEMP/screenshot-comment.md"
      - name: Write that this commit has no screenshots
        if: ${{ steps.head.outputs.current == 'true' && env.SAVED != 'true' }}
        run: |
          {
            echo "$MARKER"
            echo "## Screenshots"
            echo
            echo "No screenshots of ${HEAD_SHA:0:7}: the [E2E run]($RUN_URL) ended with \`$WEB_RESULT\` and uploaded none."
          } > "$RUNNER_TEMP/screenshot-comment.md"
      - name: Post or update the screenshot comment
        if: ${{ steps.head.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($ENV.MARKER))) | .id' > "$RUNNER_TEMP/comment-ids.txt"
          id=$(head -n 1 "$RUNNER_TEMP/comment-ids.txt")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/screenshot-comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/screenshot-comment.md" > /dev/null
          fi
