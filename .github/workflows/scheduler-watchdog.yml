name: Scheduler watchdog

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  push:
    branches: [scheduler-alerts]

concurrency:
  group: scheduler-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

env:
  ALERT_TITLE: "Scheduler stopped dispatching workflows"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check that the scheduled workflows were dispatched recently
        working-directory: apps/scheduler
        run: bun scripts/watchdog.ts --alert-body "$RUNNER_TEMP/alert.md"
      - name: Open or update the alert issue
        if: ${{ failure() }}
        run: |
          if [ ! -f "$RUNNER_TEMP/alert.md" ]; then
            echo "The watchdog failed before it could check the workflows: $RUN_URL" > "$RUNNER_TEMP/alert.md"
          fi
          echo "Found by [Scheduler watchdog]($RUN_URL)." >> "$RUNNER_TEMP/alert.md"
          issue=$(gh issue list --state open --search "\"$ALERT_TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.ALERT_TITLE)) | first | .number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/alert.md"
          else
            gh issue create --title "$ALERT_TITLE" --body-file "$RUNNER_TEMP/alert.md"
          fi
      - name: Close the alert issue
        if: ${{ success() }}
        run: |
          echo "The scheduled workflows run on time again, found by [Scheduler watchdog]($RUN_URL)." > "$RUNNER_TEMP/resolved.md"
          gh issue list --state open --search "\"$ALERT_TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.ALERT_TITLE)) | .[].number" |
            while read -r issue; do
              gh issue comment "$issue" --body-file "$RUNNER_TEMP/resolved.md"
              gh issue close "$issue"
            done
