name: Scrape cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-cards
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  scrape:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Scrape the card gallery
        id: scrape
        working-directory: apps/ingest
        env:
          GALLERY_HTML_PATH: ${{ runner.temp }}/gallery.html
          REPORT_PATH: ${{ runner.temp }}/card-changes.md
          PR_BODY_PATH: ${{ runner.temp }}/pull-request-body.md
        run: |
          bun run scrape \
            --save-html "$GALLERY_HTML_PATH" \
            --report "$REPORT_PATH" \
            --pr-body "$PR_BODY_PATH" \
            --summary "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT_PATH" ]; then
            echo "report=$REPORT_PATH" >> "$GITHUB_OUTPUT"
            echo "pr-body=$PR_BODY_PATH" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the fetched gallery page
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-html
          path: ${{ runner.temp }}/gallery.html
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload the full change report
        if: steps.scrape.outputs.report != ''
        uses: actions/upload-artifact@v4
        with:
          name: card-changes
          path: ${{ steps.scrape.outputs.report }}
      - name: Open or update the snapshot pull request
        if: steps.scrape.outputs.report != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/card-snapshot
          delete-branch: true
          add-paths: apps/api/data/cards.json
          commit-message: Update card snapshot from the Riftbound gallery
          title: Update card snapshot from the Riftbound gallery
          body-path: ${{ steps.scrape.outputs.pr-body }}
