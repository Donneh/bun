name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.apply.outputs.api_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.eu.r2.cloudflarestorage.com
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_hostname: ${{ vars.API_HOSTNAME }}
      TF_VAR_web_hostname: ${{ vars.WEB_HOSTNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter @riftkeeper/api build
      - id: web
        run: |
          bun run --filter @riftkeeper/web build
          echo "build_id=$(jq -r .id apps/web/.output/public/_nuxt/builds/latest.json)" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: tofu init -input=false
        working-directory: infrastructure
      - id: apply
        working-directory: infrastructure
        run: |
          tofu apply -auto-approve -input=false
          echo "api_url=$(tofu output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "version=$(tofu output -raw worker_version_id)" >> "$GITHUB_OUTPUT"
          echo "web_url=$(tofu output -raw web_url)" >> "$GITHUB_OUTPUT"
          echo "www_url=$(tofu output -raw www_url)" >> "$GITHUB_OUTPUT"
      - name: Smoke test the deployed API
        run: bun run test:api
        env:
          BASE_URL: ${{ steps.apply.outputs.api_url }}
          EXPECTED_VERSION: ${{ steps.apply.outputs.version }}
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Smoke test the deployed web app
        run: bun run test:production
        working-directory: apps/web
        env:
          BASE_URL: ${{ steps.apply.outputs.web_url }}
          WWW_URL: ${{ steps.apply.outputs.www_url }}
          EXPECTED_BUILD_ID: ${{ steps.web.outputs.build_id }}
      - name: Upload smoke test screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-screenshots
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30
